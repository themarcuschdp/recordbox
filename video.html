<!DOCTYPE html>
<html lang="en">
<head>
<script>if ('scrollRestoration' in history) history.scrollRestoration = 'manual';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — recordbox</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<link rel="icon" href="/assets/images/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
<link rel="preconnect" href="https://cdn.plyr.io" crossorigin>
<!-- Every thumbnail and every playable video on this page comes from this
     origin, so warm the connection before the grid starts requesting them. -->
<link rel="preconnect" href="https://media.recordbox.me" crossorigin>
<!-- Bunny Stream's MP4 fallback host — a growing share of VIDEOS entries
     now point here instead of media.recordbox.me (see video.html's inline
     VIDEOS array). -->
<link rel="preconnect" href="https://vz-00d6bbee-dbe.b-cdn.net" crossorigin>
<!-- Oswald and Inter Tight — same pairing as the rest of the site now,
     replacing this page's former Syne/DM Sans — self-hosted (see watch.css)
     instead of fetched from fonts.googleapis.com/fonts.gstatic.com. One
     less pair of third-party origins on the critical path. Preloaded
     because both render text in the first paint. -->
<link rel="preload" href="/assets/fonts/oswald-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/inter-tight-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="assets/css/watch.css?v=4">
<!-- Plyr's stylesheet only matters once the player is instantiated, which
     happens on first video click — load it without blocking first paint. -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" /></noscript>
<style>
  /* This page reuses the design tokens (--bg, --surface, --amber, --font-display,
     --font-body, etc.) defined in assets/css/watch.css (split out of style.css's
     former "CHANEL PRIVATE PAGE STYLES" section) so the look stays in sync with
     exclusive.html automatically. */

  *{ box-sizing: border-box; }
  html,body.watch{ margin:0; padding:0; }
  body.watch{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1,h2,h3{
    font-family: var(--font-display);
    letter-spacing: -0.02em;
  }

  a{ color: inherit; }
  button{ font-family: inherit; }

  /* ---------- top bar ---------- */
  header.site-top{
    position: sticky;
    top: 0;
    z-index: 70;
    background: rgba(22,20,18,0.92);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .site-top-inner{
    max-width: 1400px;
    margin: 0 auto;
    padding: 14px 24px;
    display:flex;
    align-items:center;
    gap: 18px;
    position: relative;
  }

  .hamburger{
    appearance:none;
    border: none;
    background: transparent;
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: background .15s ease;
  }
  .hamburger:hover, .hamburger.open{ background: var(--surface-2); }
  .hamburger svg{ width:20px; height:20px; }

  .brand{
    font-family: var(--font-display);
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 700;
    white-space: nowrap;
    text-decoration: none;
    flex-shrink: 0;
  }
  .brand span{ color: var(--amber); }
  .brand-logo-img{ height: 40px; width: auto; display: block; flex-shrink: 0; }

  .count-tag{
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .back-btn{
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.85rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 0.8rem;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .back-btn:hover{ color: var(--text); border-color: var(--muted); }
  .back-btn svg{ width:13px; height:13px; }

  .nav-search{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    border:1px solid var(--border);
    border-radius: 999px;
    padding: 0.45rem 0.9rem;
    background: transparent;
    flex-shrink: 1;
    min-width: 0;
    margin-right: 4px;
    box-sizing: border-box;
    overflow: hidden;
    transition: width .25s ease, padding .25s ease;
  }
  .nav-search-toggle{
    appearance:none;
    border:none;
    background:transparent;
    padding:0;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .nav-search svg{ width:14px; height:14px; color: var(--muted); flex-shrink:0; pointer-events:none; }
  .nav-search input{
    appearance:none;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    font-family: var(--font-body);
    font-size: 0.8rem;
    line-height: 1.6;
    width: 140px;
    min-width: 0;
    white-space: nowrap;
    transition: width .25s ease, opacity .2s ease;
  }
  .nav-search input::placeholder{ color: rgba(255,255,255,0.55); }
  @media (max-width: 1000px){
    .nav-search{
      width: 36.84px;
      padding: 0.45rem;
      gap:0;
    }
    .nav-search input{
      width: 0;
      opacity: 0;
    }
    .nav-search.open{
      position: absolute;
      top: 50%;
      left: 16px;
      right: 16px;
      transform: translateY(-50%);
      height: auto;
      width: auto;
      padding: 0.45rem 0.9rem;
      margin-right: 0;
      background: rgba(22,20,18,0.98);
      border: 1px solid var(--border);
      border-radius: 999px;
      z-index: 95;
      gap: 0.6rem;
    }
    .nav-search.open input{
      flex: 1;
      width: auto;
      opacity: 1;
    }
  }

  /* desktop-only category buttons, placed after the logo — styled like
     the .back-btn "Home" button above (same look, different position) */
  .cat-nav-desktop{ display:none; }
  @media (min-width: 1000px){
    .hamburger{ display:none; }
    .cat-nav-desktop{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap: 8px;
    }
  }
  .cat-nav-desktop .cat-btn{
    display:flex;
    align-items:center;
    gap:0.4rem;
    padding:0.45rem 0.85rem;
    background:transparent;
    border:1px solid var(--border);
    border-radius:6px;
    color: var(--muted);
    font-family: var(--font-body);
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition: color 0.2s, border-color 0.2s, background-color 0.2s;
  }
  .cat-nav-desktop .cat-btn:hover{ color: var(--text); border-color: var(--muted); }
  .cat-nav-desktop .cat-btn.active{ color:#fff; background: var(--amber); border-color: var(--amber); }
  .cat-nav-desktop .cat-btn svg{ width:13px; height:13px; flex-shrink:0; }

  /* category dropdown menu, opened via hamburger (mobile only) */
  .cat-menu{
    position:absolute;
    top: calc(100% + 6px);
    left: 24px;
    z-index: 80;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-width: 200px;
    padding: 6px;
    display:none;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .cat-menu.open{ display:block; }
  .cat-menu .tab{
    width:100%;
    text-align:left;
    appearance:none;
    border:none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 12px;
    cursor:pointer;
    border-radius: 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition: color .15s ease, background .15s ease;
  }
  .cat-menu .tab:hover{ color: var(--text); background: rgba(255,255,255,0.04); }
  .cat-menu .tab.active{ color:#fff; background: var(--amber); }
  .cat-menu .tab .tab-count{ opacity:.7; font-weight:500; margin-left:8px; }

  /* ---------- watch layout ----------
     .watch-sidebar lives INSIDE .watch-main (not as its sibling) so that on
     mobile .watch-main's height includes the full video grid, giving
     .watch-sticky real scrollable room to actually stick within. On desktop,
     .watch-main becomes the two-column grid, with .watch-sticky and
     .watch-sidebar as its row items (grid stretches .watch-sticky's row to
     match the taller sidebar, same effect). ---------- */
  .watch-layout{
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    display: block;
  }
  .watch-main{ }
  .watch-sidebar{ margin-top: 22px; }

  @media (min-width: 1000px){
    .watch-main.has-player{
      display: grid;
      grid-template-columns: minmax(0,1fr) 380px;
      gap: 28px;
    }
    .watch-main.has-player .watch-sidebar{ margin-top: 0; }
  }

  /* ---------- sticky wrapper (desktop only: video + meta stick together while
     sidebar scrolls) ---------- */
  .watch-sticky{ }
  @media (min-width: 1000px){
    .watch-sticky{
      position: sticky;
      top: 78px;
      align-self: start;
    }
  }

  /* ---------- player ----------
     On mobile the video plays inline in normal document flow (not sticky/
     fixed) at the top of the page. ---------- */
  #player-dock{
    display: none;
    z-index: 3;
    background: #000;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #player-dock.active{ display:block; }

  /* ---------- mobile sticky mini-player ----------
     When the playing video scrolls out from the top of the viewport on
     mobile, it docks as a small fixed player under the sticky header. ---------- */
  #player-dock.docked{
    position: fixed;
    top: 62px;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 60;
    box-shadow: 0 12px 30px rgba(0,0,0,0.55);
  }
  .dock-close{
    position:absolute;
    top: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.55);
    color: #fff;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index: 5;
    padding: 0;
  }
  .dock-close svg{ width:13px; height:13px; }
  /* Plyr adds .plyr--hide-controls while idle; only show our close button
     alongside Plyr's own controls (i.e. when that class is absent). */
  #player-dock.docked:not(.hide-controls) .dock-close{ display:flex; }

  .player-frame{
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background:#000;
    display:flex;
    justify-content:center;
  }
  .player-frame video, .player-frame .plyr{
    width: 100%;
    height: 100%;
  }
  .plyr{
    --plyr-color-main: var(--amber);
  }


  /* ---------- meta block under player ---------- */
  .player-meta{
    padding: 18px 2px 0;
  }
  #player-dock:not(.active) ~ .player-meta{ display: none; }
  .player-title{
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 14px;
    line-height: 1.3;
  }
  .channel-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .channel-row.clickable{
    cursor: pointer;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    text-align: left;
    width: 100%;
    font: inherit;
    color: inherit;
  }
  .channel-row.clickable:hover .channel-name{ color: var(--amber); }
  .channel-avatar{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--amber);
    color:#fff;
    font-family: var(--font-display);
    font-size: 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .channel-name{
    font-size: 14px;
    font-weight: 700;
    margin: 0;
    text-transform: uppercase;
  }
  .channel-count{
    font-size: 12.5px;
    color: var(--muted);
    margin: 2px 0 0;
  }
  .player-desc{
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 720px;
  }
  .player-desc .readmore-btn{
    background:none;border:none;color: var(--amber);
    font-size: 13.5px; font-weight:700; cursor:pointer; padding:0; margin-left:4px;
    font-family:inherit;
  }

  .empty-player{
    display:none;
    align-items:center;
    justify-content:center;
    aspect-ratio: 16/9;
    background: var(--surface);
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 13px;
    border-radius: 0;
  }
  .empty-player.show{ display:flex; }

  /* ---------- badge (per-card letter avatar) ---------- */
  .badge{
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--amber);
    color: #fff;
    font-family: var(--font-display);
    font-size: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* ---------- CEO IN ACTION (vertical shorts row) ----------
     A YouTube-Shorts-style shelf: one horizontally scrolling row of 9:16
     cards (5 visible at once on desktop, 3 on mobile — flex-basis below),
     not a wrapped grid, so it scales to any number of videos without
     needing pagination logic. Populated at render time from
     VIDEOS.filter(v => v.vertical) — see renderCeoShorts(). renderGrid()
     moves this element into #grid itself, after the first row of regular
     cards (see there for why) — grid-column: 1/-1 makes it span every
     column at the current breakpoint instead of getting sized like a
     single video card. */
  .ceo-shorts{ grid-column: 1 / -1; margin: 6px 0 28px; }
  .ceo-shorts-header{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .ceo-shorts-header img{ width: 22px; height: 22px; flex-shrink:0; }
  .ceo-shorts-header span{
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
  }
  .ceo-shorts-wrap{ position:relative; }
  .ceo-shorts-row{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .ceo-shorts-row::-webkit-scrollbar{ display:none; }
  .short-card{
    flex: 0 0 calc((100% - 2 * 10px) / 3);
    scroll-snap-align: start;
    aspect-ratio: 9 / 16;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-2);
    -webkit-animation: fadeUp 0.4s ease both;
    animation: fadeUp 0.4s ease both;
  }
  @media (min-width: 1000px){
    .short-card{ flex-basis: calc((100% - 4 * 10px) / 5); }
  }
  .short-card img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit: cover; pointer-events:none;
    transition: transform .3s ease;
  }
  .short-card:hover img{ transform: scale(1.05); }
  .short-card::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 45%, transparent 70%);
    pointer-events:none;
  }
  .short-card .short-title{
    position:absolute; left:8px; right:8px; bottom:8px;
    color:#fff;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .short-card .short-play{
    position:absolute; top:8px; right:8px;
    width:22px; height:22px; border-radius:50%;
    background: rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
  }
  .short-card .short-play svg{ width:10px; height:10px; fill:#fff; }

  .shorts-arrow{
    position:absolute; top:0; bottom:0;
    width: 40px;
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer;
    color:#fff;
    opacity:0;
    transition: opacity .2s ease;
    z-index:2;
  }
  .ceo-shorts-wrap:hover .shorts-arrow{ opacity:1; }
  .shorts-arrow svg{
    width:26px; height:26px;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7));
  }
  .shorts-arrow.prev{ left:-6px; background: linear-gradient(to right, var(--bg) 15%, transparent 100%); }
  .shorts-arrow.next{ right:-6px; background: linear-gradient(to left, var(--bg) 15%, transparent 100%); }
  @media (max-width: 999px){
    .shorts-arrow{ display:none; }
  }

  /* ---------- shorts player (mobile fullscreen / desktop popup) ---------- */
  #shorts-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background: rgba(0,0,0,0.85);
    align-items:center;
    justify-content:center;
  }
  #shorts-modal.open{ display:flex; }
  .shorts-modal-inner{
    position:relative;
    width: 100%;
    height: 100%;
  }
  @media (min-width: 1000px){
    .shorts-modal-inner{
      width: auto;
      height: 90vh;
      aspect-ratio: 9 / 16;
      border-radius: 8px;
      overflow:hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
  }
  .shorts-modal-inner video{
    width:100%; height:100%;
    object-fit: contain;
    background:#000;
  }
  .shorts-close{
    position:absolute;
    top: 12px; right: 12px;
    z-index:1;
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background: rgba(0,0,0,0.55);
    color:#fff;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .shorts-modal-inner .plyr{ width:100%; height:100%; }
  .shorts-modal-inner .plyr video{ object-fit: contain; }

  @media (prefers-reduced-motion: reduce){
    .short-card{ animation: none; }
    .short-card img, .shorts-arrow{ transition: none; }
  }

  /* ---------- grid / sidebar list (shared component) ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px 18px;
  }
  @media (min-width: 1000px) and (max-width: 2200px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }
  .card{
    cursor:pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 0;
    overflow:hidden;
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    -webkit-animation: fadeUp 0.4s ease both;
    animation: fadeUp 0.4s ease both;
  }
  .card:hover{
    border-color: var(--amber-dim);
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  .card.playing{ border-color: var(--amber); }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(12px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* thumbnail: Bunny Stream generates a static JPG per video at encode
     time (https://.../<guid>/thumbnail.jpg) — one small image request
     with native lazy-loading, instead of the old technique of opening a
     connection to the full video file and decoding a frame at 0.5s
     client-side. That was fine for a handful of cards but genuinely slow
     once the grid grew past a dozen entries, especially for the
     multi-hundred-MB/multi-GB source files some of these are. Rows that
     aren't hosted on Bunny yet have no generated thumbnail to point at,
     so they fall back to a plain letter badge instead of attempting the
     old (broken/slow) video-frame approach at all. */
  .thumb{
    position:relative;
    aspect-ratio: 16/9;
    background: var(--surface-2);
    overflow: hidden;
  }
  .thumb img.thumb-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    pointer-events:none;
    transition: transform .4s ease;
  }
  .card:hover .thumb img.thumb-img{ transform: scale(1.05); }

  .thumb-letter{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--surface-2);
    color: var(--amber);
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* Gated client content (see the "locked" flag in VIDEOS): no thumbnail
     is ever fetched or shown for these — just a lock icon, so the
     catalog can list that the work exists without previewing content
     that's only meant to be seen behind exclusive.html's password gate. */
  .thumb-locked{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(
      135deg,
      color-mix(in srgb, var(--amber) 24%, var(--surface)) 0%,
      color-mix(in srgb, var(--orange) 24%, var(--surface)) 100%
    );
  }
  .thumb-locked svg{
    width: 34px;
    height: 34px;
    color: var(--muted);
  }
  .card.locked:hover .thumb-locked svg{ color: var(--amber); }

  .thumb::after{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(to top, rgba(22,20,18,0.7) 0%, rgba(22,20,18,0.15) 55%, transparent 100%);
    pointer-events:none;
    z-index:1;
  }

  .thumb .play-ico{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 42px; height:42px;
    border-radius:50%;
    border: 1.5px solid rgba(255,255,255,0.55);
    background: rgba(0,0,0,0.45);
    display:flex;align-items:center;justify-content:center;
    transition: border-color .2s ease, transform .2s ease;
    flex-shrink:0;
    z-index:2;
  }
  .thumb .play-ico svg{ width:14px; height:14px; margin-left:2px; fill:#fff; }
  .card:hover .play-ico{ border-color: var(--amber); transform: translate(-50%,-50%) scale(1.08); }

  .card-body{
    padding: 12px 12px 14px;
    display:flex;
    gap: 10px;
  }
  .card-body .badge{ width:24px; height:24px; font-size:10.5px; }
  .card-title{
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 4px;
    color: var(--text);
  }
  .card-cat{
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  /* desktop sidebar: cards become a horizontal list (only once a video is playing) */
  @media (min-width: 1000px){
    .has-player .watch-sidebar .grid{
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .has-player .watch-sidebar .card{
      display:flex;
      flex-direction:row;
      gap: 10px;
      background: transparent;
      border: none;
    }
    .has-player .watch-sidebar .card:hover{ transform:none; border-color: transparent; background: var(--surface); box-shadow:none; }
    .has-player .watch-sidebar .card.playing{ background: var(--surface); border-color: transparent; }
    .has-player .watch-sidebar .thumb{
      width: 168px;
      flex-shrink: 0;
      border-radius: 0;
    }
    .has-player .watch-sidebar .thumb .play-ico{ width:32px; height:32px; }
    .has-player .watch-sidebar .thumb .play-ico svg{ width:11px; height:11px; }
    .has-player .watch-sidebar .card-body{
      padding: 2px 4px;
      flex: 1;
      min-width: 0;
    }
    .has-player .watch-sidebar .card-title{
      font-size: 12.5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  /* focus visibility */
  button:focus-visible, .card:focus-visible, a:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  @media (max-width: 600px){
    .watch-layout{ padding: 16px; }
    .site-top-inner{ padding: 12px 16px; gap: 10px; }
    .brand-logo-img{ height: 30px; }
    .nav-search{ flex-shrink: 0; }
    .grid{ grid-template-columns: 1fr; margin: 0 -16px; }
    .grid .card{ border-left: none; border-right: none; }
  }
</style>

// Shuffle so repeat visits don't always see the same order — but weave
// locked (gated) cards back in at a steady interval rather than leaving
// their placement to pure chance, since a plain shuffle can clump several
// of them into the same row.
function shuffleArr(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Merges b's items evenly across a (preserving each array's own internal
// order) so neither ends up bunched into one stretch of the result.
function distributeEvenly(a, b){
  const total = a.length + b.length;
  const result = [];
  let ai = 0, bi = 0;
  for (let i = 0; i < total; i++) {
    const aTarget = Math.round((i + 1) * a.length / total);
    if (ai < aTarget && ai < a.length) result.push(a[ai++]);
    else if (bi < b.length) result.push(b[bi++]);
    else result.push(a[ai++]);
  }
  return result;
}

const lockedVideos = shuffleArr(VIDEOS.filter(v => v.locked));
const unlockedCorpVideos = shuffleArr(VIDEOS.filter(v => !v.locked && v.category === 'corporate'));
const otherVideos = shuffleArr(VIDEOS.filter(v => !v.locked && v.category !== 'corporate'));

// Spread locked cards evenly within Corporate first (that's the filtered
// view where all of them live), then spread that corporate block evenly
// across everything else so the ALL view doesn't clump them either.
const corporateVideos = distributeEvenly(lockedVideos, unlockedCorpVideos);
const finalVideos = distributeEvenly(corporateVideos, otherVideos);

VIDEOS.length = 0;
VIDEOS.push(...finalVideos);

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function truncate(str, n){
  if (str.length <= n) return { short: str, needsMore: false };
  let cut = str.slice(0, n);
  cut = cut.slice(0, cut.lastIndexOf(' '));
  return { short: cut + '…', needsMore: true };
}

/* Most videos have one category, but a few genuinely belong in more than
   one (e.g. a personal trip that's also travel footage) — v.categories,
   when present, lists every filter it should show up under, in addition
   to its primary v.category (used for the badge/label everywhere else). */
function matchesCategory(v, key){
  return v.category === key || (v.categories && v.categories.includes(key));
}

function currentList(){
  // Locked (exclusive/gated) cards only ever belong on the ALL view —
  // they should never show up under a specific category tab like Corporate.
  let list = activeFilter === 'all' ? VIDEOS : VIDEOS.filter(v => matchesCategory(v, activeFilter) && !v.locked);
  if (searchQuery) list = list.filter(v => v.title.toLowerCase().includes(searchQuery));
  return list;
}

/* Bunny-hosted rows get their pre-generated thumbnail.jpg via a plain
   lazy-loaded <img> — no observer needed, the browser handles image lazy
   loading natively. Rows not yet on Bunny have no thumbnail to fetch, so
   they get a letter badge instead of hitting the old (broken/slow)
   video-frame technique. */
function thumbMarkup(v){
  if (v.locked) {
    return `<div class="thumb-locked" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    </div>`;
  }
  const m = /vz-00d6bbee-dbe\.b-cdn\.net\/([a-f0-9-]+)\//.exec(v.url);
  if (m) {
    return `<img src="https://vz-00d6bbee-dbe.b-cdn.net/${m[1]}/thumbnail.jpg" alt="" loading="lazy" class="thumb-img" />`;
  }
  return `<div class="thumb-letter">${escapeHtml(v.letter)}</div>`;
}

/* Bunny also auto-generates a short animated preview.webp per video
   (same guid, alongside thumbnail.jpg) — this wires that into a hover
   effect on any <img> already pointed at a Bunny thumbnail. Gated to
   devices that actually support hover: a touch tap can fire a synthetic
   mouseenter right before navigating away, which would waste a
   multi-MB download on exactly the connections where it matters most.
   Never preloaded — only ever fetched on first real hover, into a
   throwaway Image() first so a slow connection never shows a broken
   image mid-swap, and only committed if the mouse is still over the
   card once it finishes loading. */
const supportsHoverPreview = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

function wireHoverPreview(imgEl){
  if (!supportsHoverPreview) return;
  const m = /vz-00d6bbee-dbe\.b-cdn\.net\/([a-f0-9-]+)\//.exec(imgEl.src);
  if (!m) return;

  const staticSrc = imgEl.src;
  const previewSrc = `https://vz-00d6bbee-dbe.b-cdn.net/${m[1]}/preview.webp`;
  let hovering = false;
  let preview = null;

  // The thumbnail <img> itself is pointer-events:none (so clicks pass
  // through to the card underneath) — it never receives mouseenter at
  // all, so the listener has to live on the actual hoverable container.
  const container = imgEl.closest('.thumb') || imgEl.parentElement;
  container.addEventListener('mouseenter', () => {
    hovering = true;
    if (preview) { imgEl.src = previewSrc; return; }
    preview = new Image();
    preview.onload = () => { if (hovering) imgEl.src = previewSrc; };
    preview.src = previewSrc;
  });
  container.addEventListener('mouseleave', () => {
    hovering = false;
    imgEl.src = staticSrc;
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty-state');
  const ceoShorts = document.getElementById('ceo-shorts');
  grid.innerHTML = '';

  const list = currentList();
  emptyState.style.display = list.length ? 'none' : 'block';

  list.forEach(v => {
    const card = document.createElement('div');
    card.className = 'card' + (v.url === currentUrl ? ' playing' : '') + (v.locked ? ' locked' : '');
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', v.locked ? `View ${v.title} in Exclusive` : `Play ${v.title}`);

    card.innerHTML = `
      <div class="thumb">
        ${thumbMarkup(v)}
      </div>
      <div class="card-body">
        <div>
          <p class="card-title">${escapeHtml(v.title)}</p>
          <p class="card-cat">${escapeHtml(v.category)}</p>
        </div>
      </div>
    `;

    // Locked cards (gated client content) never play inline here — they
    // exist so the catalog isn't hiding that this work exists, but the
    // content itself only lives behind exclusive.html's password gate.
    const activate = () => v.locked ? (window.location.href = 'exclusive.html') : selectVideo(v);
    card.addEventListener('click', activate);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
    });

    const thumbImg = card.querySelector('.thumb-img');
    if (thumbImg) wireHoverPreview(thumbImg);

    grid.appendChild(card);
  });

  // Passing the reference grabbed above the innerHTML wipe (not letting
  // repositionCeoShorts() re-query it) matters here: once grid.innerHTML
  // ran, ceo-shorts (if it was already inside #grid from a previous
  // render) is disconnected from the document, and a fresh
  // document.getElementById('ceo-shorts') can no longer find it —
  // getElementById only searches the connected tree. Grabbing it first
  // keeps a live reference across the wipe regardless.
  repositionCeoShorts(ceoShorts);
}

/* CEO IN ACTION belongs after row 2 specifically — so it doesn't read
   as if the whole catalog is CEO content, but also doesn't drift onto
   the wrong row on mobile's single-column grid, which a hardcoded card
   count would do. Reads the grid's actual computed column count (1 on
   mobile, 3 in the 1000-2200px range, whatever auto-fill produces
   outside that) so "after two rows" is exact at every breakpoint, not
   just the one it happened to be tested at. Re-run on resize too (called
   with no argument there — see below for why that's fine), since
   crossing the mobile/desktop breakpoint changes the column count
   without necessarily triggering a category-switch re-render. */
function repositionCeoShorts(ceoShorts){
  const grid = document.getElementById('grid');
  // Only the renderGrid() caller needs to pass an explicit reference
  // (grabbed before its innerHTML wipe, per above). The resize handler
  // calls this with no argument and no wipe has happened, so ceo-shorts
  // is still connected and a plain lookup is fine.
  if (!ceoShorts) ceoShorts = document.getElementById('ceo-shorts');
  const cards = Array.from(grid.children).filter(el => el !== ceoShorts);
  const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length || 1;
  const afterIndex = Math.min(cols * 2, cards.length);
  grid.insertBefore(ceoShorts, cards[afterIndex] || null);
}

/* On mobile, selecting a video does a real page refresh so the chosen
   video renders at the top of the page (normal flow, not sticky/fixed)
   with its details right below it. */
function selectVideo(v){
  if (isDesktop()) { playVideo(v); return; }
  try { sessionStorage.setItem('rb-selected-video', v.url); } catch(e) {}
  location.reload();
}

/* Bunny-hosted videos also have an HLS manifest at the same guid (a
   different path than the play_720p.mp4 fallback used elsewhere on the
   site) — that's what actually gets adaptive quality switching, since a
   single MP4 is always the one fixed resolution baked into its URL.
   hls.js (self-hosted at assets/js/hls.light.min.js) handles it for
   Chrome/Firefox/Edge; Safari plays HLS natively so it skips hls.js
   entirely; anything without either — or rows not yet migrated to
   Bunny — falls back to the direct MP4 already stored in v.url. */
function toHlsUrl(url){
  const m = /vz-00d6bbee-dbe\.b-cdn\.net\/([a-f0-9-]+)\//.exec(url);
  return m ? `https://vz-00d6bbee-dbe.b-cdn.net/${m[1]}/playlist.m3u8` : null;
}

function loadSource(videoEl, v){
  if (hls) { hls.destroy(); hls = null; }

  const hlsUrl = toHlsUrl(v.url);

  if (hlsUrl && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else { hls.destroy(); hls = null; }
    });
    hls.loadSource(hlsUrl);
    hls.attachMedia(videoEl);
  } else if (hlsUrl && videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    videoEl.src = hlsUrl;
    videoEl.load();
  } else {
    videoEl.src = v.url;
    videoEl.load();
  }
}

function playVideo(v){
  currentUrl = v.url;

  const dock = document.getElementById('player-dock');
  const videoEl = document.getElementById('dock-video');
  const emptyPlayer = document.getElementById('empty-player');

  document.querySelector('.watch-main').classList.add('has-player');
  dock.classList.add('active');
  emptyPlayer.classList.remove('show');

  if (!player) {
    player = new Plyr(videoEl, { autoplay: true, clickToPlay: true });
    player.once('ready', () => {
      const plyrEl = dock.querySelector('.plyr');
      if (!plyrEl) return;
      const sync = () => dock.classList.toggle('hide-controls', plyrEl.classList.contains('plyr--hide-controls'));
      sync();
      new MutationObserver(sync).observe(plyrEl, { attributes: true, attributeFilter: ['class'] });
    });
  }
  loadSource(videoEl, v);
  player.once('canplay', () => {
    player.play().catch(err => console.warn('Playback blocked:', err));
  });
  player.once('error', (e) => {
    console.error('Plyr/video error for', v.url, e);
  });

  document.getElementById('dock-title').textContent = v.title;
  document.getElementById('dock-badge').textContent = v.letter;
  document.getElementById('channel-name').textContent = v.category;
  const catCount = VIDEOS.filter(x => x.category === v.category).length;
  document.getElementById('channel-count').textContent = `${catCount} videos`;
  document.getElementById('channel-row').onclick = () => {
    activeFilter = v.category;
    closeCatMenu();
    renderCatMenu();
    renderGrid();
  };

  const descEl = document.getElementById('dock-desc');
  const { short, needsMore } = truncate(v.desc, 220);
  if (needsMore){
    descEl.innerHTML = `<span id="dock-desc-text">${escapeHtml(short)}</span><button class="readmore-btn" id="dock-readmore">Read more</button>`;
    document.getElementById('dock-readmore').addEventListener('click', function(){
      const textEl = document.getElementById('dock-desc-text');
      if (this.textContent === 'Read more'){
        textEl.textContent = v.desc;
        this.textContent = 'Read less';
      } else {
        textEl.textContent = short;
        this.textContent = 'Read more';
      }
    });
  } else {
    descEl.textContent = v.desc;
  }

  renderGrid();
}

function closePlayer(){
  currentUrl = null;
  const dock = document.getElementById('player-dock');
  if (player) { player.pause(); }
  dock.classList.remove('active');
  dock.classList.remove('docked');
  document.querySelector('.watch-main').classList.remove('has-player');
  renderGrid();
}

/* ── Mobile sticky mini-player: once the playing video scrolls out past
   the top of the viewport, dock it as a small fixed player under the
   header. Undocks automatically once scrolled back to its original spot. ── */
let dockObserver = null;
function initDockObserver(){
  const dock = document.getElementById('player-dock');
  const sentinel = document.getElementById('dock-sentinel');
  if (!('IntersectionObserver' in window)) return;
  if (!dockObserver) {
    dockObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (isDesktop() || !dock.classList.contains('active')) {
          dock.classList.remove('docked');
          return;
        }
        dock.classList.toggle('docked', !entry.isIntersecting && entry.boundingClientRect.top < 0);
      });
    }, { threshold: 0 });
    dockObserver.observe(sentinel);
  }
}
initDockObserver();

document.getElementById('dock-close').addEventListener('click', (e) => {
  e.stopPropagation();
  closePlayer();
});

/* Switching categories (or crossing the mobile/desktop breakpoint) used
   to autoplay a replacement video when the one currently playing fell
   outside the newly selected filter — so clicking, say, Personal while
   a Corporate video was playing would silently start a different,
   unrelated video instead of just showing the Personal gallery. Now it
   closes the player instead: clicking a category tab always lands you
   on a clean gallery view of that category, and playback is only ever
   interrupted when the video you were watching genuinely isn't part of
   what you just selected — if it's still in the new filter (e.g. you
   re-select the same category, or the video is tagged into more than
   one), it keeps playing uninterrupted. */
function syncPlayerToFilter(){
  if (!isDesktop()) return;
  if (!currentUrl) return;
  const list = currentList();
  const stillInFilter = list.some(v => v.url === currentUrl);
  if (!stillInFilter) closePlayer();
}

const urlCategory = new URLSearchParams(window.location.search).get('category');
if (urlCategory && CATS.some(c => c.key === urlCategory)) {
  activeFilter = urlCategory;
}

const navSearch = document.getElementById('nav-search');
const navSearchInput = document.getElementById('nav-search-input');
const isMobileSearch = () => window.matchMedia('(max-width: 1000px)').matches;

navSearchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  renderGrid();
});

document.getElementById('nav-search-toggle').addEventListener('click', () => {
  if (!isMobileSearch()) { navSearchInput.focus(); return; }
  if (!navSearch.classList.contains('open')) {
    navSearch.classList.add('open');
    navSearchInput.focus();
  } else {
    navSearch.classList.remove('open');
    navSearchInput.blur();
  }
});

navSearchInput.addEventListener('blur', () => {
  if (isMobileSearch() && !navSearchInput.value.trim()) navSearch.classList.remove('open');
});

navSearchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    navSearchInput.value = '';
    searchQuery = '';
    renderGrid();
    if (isMobileSearch()) navSearch.classList.remove('open');
    navSearchInput.blur();
  }
});

/* CEO IN ACTION: a horizontally scrolling shelf of vertical (9:16) clips,
   built from the same VIDEOS catalog the regular grid reads from — a
   video just needs vertical: true to show up here, in addition to
   whatever category listing it already appears in. */
function shortThumbUrl(v){
  const m = /vz-00d6bbee-dbe\.b-cdn\.net\/([a-f0-9-]+)\//.exec(v.url);
  return m ? `https://vz-00d6bbee-dbe.b-cdn.net/${m[1]}/thumbnail.jpg` : '';
}

function renderCeoShorts(){
  const panel = document.getElementById('ceo-shorts');
  const row = document.getElementById('ceo-shorts-row');
  const shorts = VIDEOS.filter(v => v.vertical);
  if (!shorts.length) { panel.style.display = 'none'; return; }

  panel.style.display = '';
  row.innerHTML = shorts.map(v => `
    <div class="short-card" tabindex="0" role="button" aria-label="Play ${escapeHtml(v.title)}">
      <img src="${escapeHtml(shortThumbUrl(v))}" alt="" loading="lazy" />
      <div class="short-play">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </div>
      <p class="short-title">${escapeHtml(v.title)}</p>
    </div>
  `).join('');

  Array.from(row.children).forEach((card, i) => {
    card.addEventListener('click', () => openShort(shorts[i]));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openShort(shorts[i]); }
    });
    wireHoverPreview(card.querySelector('img'));
  });
}

document.getElementById('shorts-prev').addEventListener('click', () => {
  const row = document.getElementById('ceo-shorts-row');
  row.scrollBy({ left: -row.clientWidth * 0.9, behavior: 'smooth' });
});
document.getElementById('shorts-next').addEventListener('click', () => {
  const row = document.getElementById('ceo-shorts-row');
  row.scrollBy({ left: row.clientWidth * 0.9, behavior: 'smooth' });
});

/* Separate player/hls instance from the main dock above — a 9:16 clip in
   the dock's 16:9-styled control bar would look wrong, so this is its
   own <video>, own Plyr instance, own hls.js instance. */
let shortsPlayer = null;
let shortsHls = null;

function loadShortSource(videoEl, v){
  if (shortsHls) { shortsHls.destroy(); shortsHls = null; }
  const hlsUrl = toHlsUrl(v.url);
  if (hlsUrl && window.Hls && Hls.isSupported()) {
    shortsHls = new Hls();
    shortsHls.on(Hls.Events.ERROR, (event, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) shortsHls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) shortsHls.recoverMediaError();
      else { shortsHls.destroy(); shortsHls = null; }
    });
    shortsHls.loadSource(hlsUrl);
    shortsHls.attachMedia(videoEl);
  } else if (hlsUrl && videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    videoEl.src = hlsUrl;
    videoEl.load();
  } else {
    videoEl.src = v.url;
    videoEl.load();
  }
}

function openShort(v){
  const modal = document.getElementById('shorts-modal');
  const videoEl = document.getElementById('shorts-video');

  if (!shortsPlayer) {
    shortsPlayer = new Plyr(videoEl, { autoplay: true, clickToPlay: true });
  }
  loadShortSource(videoEl, v);
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  shortsPlayer.once('canplay', () => {
    shortsPlayer.play().catch(err => console.warn('Playback blocked:', err));
  });
}

function closeShort(){
  const modal = document.getElementById('shorts-modal');
  const videoEl = document.getElementById('shorts-video');
  if (shortsHls) { shortsHls.destroy(); shortsHls = null; }
  if (shortsPlayer) shortsPlayer.pause();
  videoEl.removeAttribute('src');
  videoEl.load();
  modal.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('shorts-close').addEventListener('click', closeShort);
document.getElementById('shorts-modal').addEventListener('click', (e) => {
  if (e.target.id === 'shorts-modal') closeShort();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('shorts-modal').classList.contains('open')) closeShort();

  if (e.code === 'Space' || e.key === ' ') {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

    const shortsOpen = document.getElementById('shorts-modal').classList.contains('open');
    const dockActive = document.getElementById('player-dock').classList.contains('active');
    const activePlayer = shortsOpen ? shortsPlayer : (dockActive ? player : null);
    if (activePlayer) {
      e.preventDefault();
      activePlayer.togglePlay();
    }
  }
});

renderCatMenu();
renderGrid();
renderCeoShorts();
syncPlayerToFilter();

if (!isDesktop()) {
  let pendingUrl;
  try {
    pendingUrl = sessionStorage.getItem('rb-selected-video');
    sessionStorage.removeItem('rb-selected-video');
  } catch(e) {}
  if (pendingUrl) {
    const pendingVideo = VIDEOS.find(v => v.url === pendingUrl);
    if (pendingVideo) {
      playVideo(pendingVideo);
      window.scrollTo(0, 0);
    }
  }
}

window.addEventListener('resize', () => {
  syncPlayerToFilter();
  repositionCeoShorts();
});
</script>

</body>
</html>
